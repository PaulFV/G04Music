<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G04Musik Entwurf</title>
<style>
/* Layout: wie G04TV – Glas-Seitenleiste links, Kopfzeile, oben die „Bühne“ (Player), darunter Reiter mit Kacheln; Handy: untere Leiste */
:root{
  --bg-0:#05070B; --bg-1:#080C13; --bg-2:#0C121B;
  --acc:#FF3B4E; --acc-2:#D61F3A; --acc-rgb:255,59,78;
  --acc-dim:rgba(var(--acc-rgb),.14); --acc-line:rgba(var(--acc-rgb),.32);
  --violet:#A78BFA; --violet-dim:rgba(167,139,250,.14);
  --gold:#FFC857; --live:#FF4D6D;
  --tx-0:#E9F1F7; --tx-1:#9DB0BE; --tx-2:#6B7E8C; --on-acc:#FFFFFF;
  --glass-bg:rgba(255,255,255,.035); --glass-bg-2:rgba(255,255,255,.055);
  --glass-br:rgba(255,255,255,.085); --glass-hi:rgba(255,255,255,.14);
  --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:30px;
  --sidebar-w:246px; --tabbar-h:66px;
  --sh-1:0 1px 0 var(--glass-hi) inset,0 12px 34px rgba(0,0,0,.5);
  --ease:cubic-bezier(.22,.9,.25,1); --dur:.34s;
  --font:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,"SF Mono",Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--tx-0);background:var(--bg-0);font-size:15px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc);text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

.bg-grid{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:linear-gradient(rgba(var(--acc-rgb),.026) 1px,transparent 1px) 0 0/64px 64px,
             linear-gradient(90deg,rgba(var(--acc-rgb),.026) 1px,transparent 1px) 0 0/64px 64px,var(--bg-0);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 20%,transparent 80%);mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 20%,transparent 80%)}
.bg-glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(700px 460px at 12% -8%,rgba(var(--acc-rgb),.15),transparent 62%),
             radial-gradient(620px 420px at 92% 4%,rgba(167,139,250,.11),transparent 62%),
             radial-gradient(900px 620px at 50% 108%,rgba(var(--acc-rgb),.06),transparent 66%);
  animation:aura 22s var(--ease) infinite alternate}
@keyframes aura{to{transform:translate3d(0,-14px,0) scale(1.04)}}
.glass{background:var(--glass-bg);border:1px solid var(--glass-br);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);box-shadow:var(--sh-1)}

/* ---------- Rahmen ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100%}
.brand{display:flex;align-items:center;gap:10px;padding:4px 2px}
.brand__mark{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#0d1824,#04070b);border:1px solid var(--acc-line);box-shadow:0 0 16px rgba(var(--acc-rgb),.25);color:var(--acc)}
.brand__text{font-size:19px;font-weight:600;letter-spacing:-.02em}
.brand__text b{color:var(--acc);font-weight:800}
.brand__ver{font-size:11px;color:var(--tx-2);border:1px solid var(--glass-br);padding:2px 7px;border-radius:99px}

.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;padding:20px 14px;border-radius:0;border-width:0 1px 0 0;z-index:40}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav__sep{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-2);padding:14px 12px 4px}
.nav__item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:var(--r-sm);background:transparent;border:1px solid transparent;color:var(--tx-1);text-align:left;font-size:14.5px;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.nav__item:hover{background:var(--glass-bg-2);color:var(--tx-0)}
.nav__item.is-active{background:linear-gradient(90deg,var(--acc-dim),transparent 85%);border-color:var(--acc-line);color:var(--acc)}
.nav__item.is-active svg{filter:drop-shadow(0 0 6px rgba(var(--acc-rgb),.6))}
.nav__badge{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--acc-dim);color:var(--acc)}
.nav__badge--v{background:var(--violet-dim);color:var(--violet)}
.sidebar__foot{border-top:1px solid var(--glass-br);padding-top:12px}
.now-chip{display:flex;align-items:center;gap:10px;font-size:13px;min-width:0}
.now-chip__ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;border:1px solid var(--glass-br);background:var(--glass-bg-2);color:var(--tx-2)}
.now-chip.is-live .now-chip__ic{border-color:var(--acc-line);background:var(--acc-dim);color:var(--acc)}
.now-chip__meta{min-width:0}
.now-chip__meta b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-chip__meta span{color:var(--tx-2);font-size:11.5px}

.main{min-width:0;display:flex;flex-direction:column;padding-bottom:32px}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:18px max(16px,3vw) 18px;background:linear-gradient(180deg,rgba(5,7,11,.86),rgba(5,7,11,.42) 70%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.topbar__title{min-width:0}
.topbar__title h1{font-size:clamp(20px,2.6vw,26px)}
.topbar__title p{color:var(--tx-2);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar__actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar .brand{display:none}
.icon-btn{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--glass-bg);border:1px solid var(--glass-br);color:var(--tx-1);transition:all var(--dur) var(--ease)}
.icon-btn:hover{color:var(--acc);border-color:var(--acc-line);background:var(--acc-dim)}
.live-chip{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:99px;background:var(--glass-bg);border:1px solid var(--glass-br);color:var(--tx-0);font-weight:600;font-size:13.5px;max-width:240px}
.live-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-chip i{width:8px;height:8px;border-radius:50%;background:var(--tx-2);flex:none}
.live-chip.is-on i{background:var(--acc);box-shadow:0 0 10px var(--acc);animation:pulse 1.6s infinite}
.live-chip.is-radio i{background:var(--live);box-shadow:0 0 10px var(--live)}
@keyframes pulse{50%{opacity:.4}}
.draft-chip{font-size:11.5px;color:var(--violet);border:1px solid rgba(167,139,250,.35);background:var(--violet-dim);padding:4px 10px;border-radius:99px;white-space:nowrap}

.view{padding:0 max(16px,3vw);display:flex;flex-direction:column;gap:18px;animation:viewIn .4s var(--ease)}
@keyframes viewIn{from{opacity:.4;transform:translateY(6px)}}
.panel{border-radius:var(--r-xl);padding:16px}

/* ---------- Bühne ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:center;border-color:var(--acc-line);box-shadow:var(--sh-1),0 0 40px rgba(var(--acc-rgb),.08)}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--glass-br);background:#000}
.stage__art{position:absolute;inset:0;transition:background 1s var(--ease)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
[hidden]{display:none!important}
.stage__cover{position:absolute;left:24px;bottom:24px;display:flex;align-items:flex-end;gap:16px;right:24px;z-index:1;isolation:isolate}
.stage__cover::before{content:"";position:absolute;inset:-70px -24px -24px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.72));z-index:-1;pointer-events:none}
.cover{flex:none;width:clamp(72px,12vw,128px);aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:clamp(22px,3.4vw,40px);color:rgba(255,255,255,.92);box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.12) inset;letter-spacing:-.04em}
.stage__meta{min-width:0;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.stage__meta small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.stage__meta h2{font-size:clamp(18px,2.6vw,30px)}
.stage__meta p{color:var(--tx-1);font-size:14px}
.stage__badge{position:absolute;top:14px;left:14px;display:flex;gap:8px}
.pill{font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.45);border:1px solid var(--glass-br);color:var(--tx-0)}
.pill--live{background:rgba(0,0,0,.6);border-color:rgba(255,77,109,.6);color:#fff}
.pill--live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);margin-right:5px;vertical-align:1px;box-shadow:0 0 6px var(--live)}
.pill--yt{background:#FF3B3B;border-color:transparent;color:#fff}
.stage__idle{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--tx-1);padding:20px}
.stage__idle svg{color:var(--acc);filter:drop-shadow(0 0 18px rgba(var(--acc-rgb),.7))}

.np{display:flex;flex-direction:column;gap:14px;min-width:0}
.np__head{display:flex;gap:12px;align-items:center}
.np__ic{width:46px;height:46px;flex:none;border-radius:13px;display:grid;place-items:center;border:1px solid var(--glass-br);background:var(--glass-bg-2);color:var(--acc)}
.np__head small{color:var(--tx-2);font-size:12px;font-weight:600}
.np__head b{display:block;font-size:17px;line-height:1.25}
.np__head span{color:var(--tx-1);font-size:13px}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tx-2)}
.prog__bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.08);position:relative;cursor:pointer}
.prog__bar i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:linear-gradient(90deg,var(--acc-2),var(--acc));box-shadow:0 0 10px rgba(var(--acc-rgb),.6)}
.prog__bar.is-live i{width:100%!important;background:repeating-linear-gradient(90deg,var(--live) 0 10px,rgba(255,77,109,.35) 10px 20px);animation:livebar 1s linear infinite;background-size:20px 100%;box-shadow:none}
@keyframes livebar{to{background-position:20px 0}}
.ctl{display:flex;align-items:center;gap:10px}
.ctl .icon-btn{width:42px;height:42px}
.play-btn{width:56px;height:56px;border-radius:50%;border:0;display:grid;place-items:center;background:linear-gradient(180deg,var(--acc),var(--acc-2));color:var(--on-acc);box-shadow:0 0 26px rgba(var(--acc-rgb),.45)}
.icon-btn.is-on{color:var(--acc);border-color:var(--acc-line);background:var(--acc-dim)}
.next{border-top:1px solid var(--glass-br);padding-top:12px;font-size:13px;color:var(--tx-2)}
.next b{color:var(--tx-0);font-weight:600}

/* ---------- Reiter & Kacheln ---------- */
.tabs{display:flex;gap:4px;padding:4px;border-radius:16px;border:1px solid var(--glass-br);background:rgba(0,0,0,.25);overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px solid transparent;background:none;color:var(--tx-1);font-weight:600;font-size:14px;white-space:nowrap}
.tab:hover{color:var(--tx-0)}
.tab.is-active{background:var(--acc-dim);border-color:var(--acc-line);color:var(--tx-0);box-shadow:0 0 18px rgba(var(--acc-rgb),.12)}
.tab em{font-style:normal;font-size:11px;padding:0 7px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--tx-1)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 2px 4px}
.chip{padding:6px 13px;border-radius:99px;border:1px solid var(--glass-br);background:var(--glass-bg);color:var(--tx-1);font-size:13px}
.chip.is-active{border-color:var(--acc-line);color:var(--acc);background:var(--acc-dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-top:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:9px;padding:10px;border-radius:var(--r-md);border:1px solid var(--glass-br);background:var(--glass-bg);text-align:left;transition:transform var(--dur) var(--ease),border-color var(--dur) var(--ease),background var(--dur) var(--ease);min-width:0}
.tile:hover{transform:translateY(-2px);border-color:var(--acc-line);background:var(--glass-bg-2)}
.tile.is-playing{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc-line),0 0 24px rgba(var(--acc-rgb),.18)}
.tile__art{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:30px;color:rgba(255,255,255,.9);letter-spacing:-.04em;position:relative;overflow:hidden}
.tile__art--wide{aspect-ratio:16/9}
.tile__art .pill{position:absolute;left:7px;top:7px}
.tile__art .dur{position:absolute;right:7px;bottom:7px;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:rgba(0,0,0,.7)}
.tile__t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile__s{color:var(--tx-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-6px}
.tile__fav{position:absolute;top:16px;right:16px;color:var(--gold);filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:var(--acc);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* ---------- Liste ---------- */
.list{display:flex;flex-direction:column;margin-top:10px}
.row{display:grid;grid-template-columns:28px 44px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid transparent;background:none;text-align:left;width:100%}
.row:hover{background:var(--glass-bg-2)}
.row.is-playing{border-color:var(--acc-line);background:var(--acc-dim)}
.row__n{color:var(--tx-2);font-size:13px;text-align:center}
.row__art{width:44px;height:44px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:15px;color:rgba(255,255,255,.9)}
.row__t{min-width:0}
.row__t b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row__t span{color:var(--tx-2);font-size:12.5px}
.row__d{color:var(--tx-2);font-size:13px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--glass-br);color:var(--tx-1)}

/* ---------- Karten ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 4px 0}
.sec-h h3{font-size:17px}
.sec-h span{color:var(--tx-2);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--glass-br);background:var(--glass-bg)}
.card__ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--acc-dim);border:1px solid var(--acc-line);color:var(--acc)}
.card__ic--v{background:var(--violet-dim);border-color:rgba(167,139,250,.35);color:var(--violet)}
.card b{font-size:15px}
.card p{color:var(--tx-1);font-size:13.5px}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--acc-line);background:var(--acc-dim);color:var(--acc);font-weight:650;font-size:14px}
.btn--solid{background:linear-gradient(180deg,var(--acc),var(--acc-2));color:var(--on-acc);border-color:transparent;box-shadow:0 0 22px rgba(var(--acc-rgb),.35)}
.phase{font-family:var(--mono);font-size:11.5px;color:var(--acc)}
.prio{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.prio--1{background:var(--acc-dim);color:var(--acc)}
.prio--2{background:var(--violet-dim);color:var(--violet)}
.prio--3{background:rgba(255,200,87,.12);color:var(--gold)}

.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.swatch{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--glass-br);background:var(--glass-bg);text-align:left}
.swatch.is-active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc-line)}
.swatch i{width:38px;height:38px;border-radius:11px;flex:none}
.swatch b{display:block;font-size:14px}
.swatch span{font-size:12px;color:var(--tx-2)}

.set{display:flex;flex-direction:column}
.set__row{display:flex;align-items:center;gap:14px;padding:13px 6px;border-bottom:1px solid var(--glass-br)}
.set__row:last-child{border-bottom:0}
.set__row div{flex:1;min-width:0}
.set__row b{display:block;font-weight:600;font-size:14.5px}
.set__row span{color:var(--tx-2);font-size:12.5px}
.set__val{color:var(--acc);font-size:13px;white-space:nowrap}
.switch{width:44px;height:26px;border-radius:99px;border:1px solid var(--glass-br);background:rgba(255,255,255,.08);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--tx-1);transition:all var(--dur) var(--ease)}
.switch[aria-checked="true"]{background:var(--acc-dim);border-color:var(--acc-line)}
.switch[aria-checked="true"]::after{left:21px;background:var(--acc);box-shadow:0 0 10px var(--acc)}

/* ---------- Mini-Player (wandernde Bühne) ---------- */
.pdock{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:20px;width:min(360px,calc(100vw - 32px));border-color:var(--acc-line)}
.pdock .cover{width:46px;font-size:16px;border-radius:11px;box-shadow:none}
.pdock__meta{flex:1;min-width:0}
.pdock__meta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdock__meta span{font-size:12px;color:var(--tx-2)}
.pdock .play-btn{width:40px;height:40px}

.tabbar{display:none}
.toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 16px;border-radius:12px;font-size:13.5px;animation:viewIn .3s var(--ease)}

@media (max-width:1100px){.hero{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .topbar .brand{display:flex}
  .topbar__title{display:none}
  .main{padding-bottom:calc(var(--tabbar-h) + 40px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:var(--tabbar-h);border-radius:24px;padding:6px;z-index:60}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid transparent;background:none;border-radius:18px;color:var(--tx-2);font-size:11px}
  .tabbar button.is-active{color:var(--acc);background:var(--acc-dim);border-color:var(--acc-line)}
  .pdock{bottom:calc(var(--tabbar-h) + 20px + env(safe-area-inset-bottom,0px));right:16px}
  .draft-chip{display:none}
  .live-chip{max-width:150px}
  .stage__cover{left:14px;bottom:14px;right:14px}
  .row{grid-template-columns:44px minmax(0,1fr) auto}
  .row__n,.row__x{display:none}
}

/* ---------- Kacheln ---------- */
function tile(x){
  var on=st.cur&&st.cur.id===x.id, fav=st.fav.indexOf(x.id)>=0, wide=x.k==='yt';

   :'<canvas id="viz"></canvas><div class="stage__idle"><div>'+ic('play',44)+'<p style="margin-top:10px;font-weight:650;color:var(--tx-0);font-size:17px">Nichts läuft</p><p>Wähle unten einen Song, einen Sender oder ein Video.</p></div></div>';

    '<div class="ctl"><button class="icon-btn'+(st.fav.indexOf(c.id)>=0?' is-on':'')+'" data-act="fav" title="Favorit">'+ic('star',18)+'</button><button class="icon-btn" data-act="lyrics" title="Liedtext">'+ic('lyrics',18)+'</button><button class="icon-btn'+(st.sleep?' is-on':'')+'" data-act="sleep" title="Einschlaf-Timer">'+ic('moon',18)+'</button>'+(st.sleep?'<span style="font-size:12.5px;color:var(--acc)">'+st.sleep+' min</span>':'')+'</div>'+

function startView(){

function sourcesView(){

    ['link','Playlist-Adresse (M3U)','Wie in G04TV: Adresse, Datei oder eingefügter Text – Quellen bleiben auf dem Gerät.',['M3U8']],
    ['cloud','GitHub / eigene Website','Deine Songs als MP3 auf GitHub Pages ablegen und über eine songs.json laden.',['optional']]];
  return '<section class="cards">'+S.map(function(s,i){return '<div class="card"><span class="card__ic'+(i>2?' card__ic--v':'')+'">'+ic(s[0],20)+'</span><b>'+s[1]+'</b><p>'+s[2]+'</p><div class="meta">'+s[3].map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div></div>'}).join('')+'</section>'+
   '<div><button class="btn btn--solid" data-toast="Im Entwurf noch ohne Funktion – kommt in Phase 1.">'+ic('list',16)+' Quelle hinzufügen</button></div>';
}
function settingsView(){
  var sw=function(k,on){return '<button class="switch" role="switch" aria-checked="'+(on?'true':'false')+'" data-sw="'+k+'" aria-label="Umschalten"></button>'};
  var g=function(t,rows){return '<section class="panel glass"><div class="sec-h" style="margin-bottom:6px"><h3>'+t+'</h3></div><div class="set">'+rows.join('')+'</div></section>'};
  var r=function(b,s,v){return '<div class="set__row"><div><b>'+b+'</b><span>'+s+'</span></div>'+v+'</div>'};
  return g('Allgemein',[r('Sprache','Deutsch und Englisch','<span class="set__val">Deutsch</span>'),r('Akzentfarbe','Siehe auch Vorschläge','<span class="set__val">'+ACC[st.acc].n+'</span>'),r('Hell / Dunkel','Ohne Neuladen, Musik spielt weiter',sw('light',false))])+
    g('Wiedergabe',[r('Übergänge (Crossfade)','Songs blenden ineinander','<span class="set__val">4 s</span>'),r('Lautstärke angleichen','Alle Songs gleich laut',sw('norm',true)),r('Weiter hören beim Blättern','Mini-Player unten rechts',sw('dock',true)),r('Einschlaf-Timer','15–90 Minuten, Ton wird leiser','<span class="set__val">aus</span>')])+
    g('Erweitert',[r('Sperrbildschirm & CarPlay','Titel, Cover, Weiter/Zurück',sw('session',true)),r('Offline-Speicher','Eigene Songs auf dem Gerät','<span class="set__val num">0 MB</span>'),r('Über G04Musik','© PaulFV · v0.1 Entwurf','<span class="set__val">'+ic('chev',16)+'</span>')]);
}
function ideasView(){
  var F=[
   [1,'Phase 1','music','Eigene Songs abspielen','Ordner oder Dateien wählen, Cover und Titel auslesen, Alben automatisch bilden. Deine Songs mit © PaulFV.'],
   [1,'Phase 1','radio','Radio mit Sendersuche','Freie Radio-Browser-Schnittstelle, Genres, Land, Favoriten. Läuft mit dem normalen Audio-Element, ohne Server.'],
   [1,'Phase 1','wave','Bühne mit Visualizer','Statt Video zeigt die Bühne Cover und ein Live-Spektrum (Web Audio). Gleiche Anordnung wie in G04TV.'],
   [1,'Phase 1','chev','Mini-Player wandert mit','Wie bei G04TV: beim Blättern läuft die Musik unten rechts weiter.'],
   [2,'Phase 2','yt','YouTube-Bereich','Kanal und Playlisten einfügen, Wiedergabe im eingebetteten Player. Hinweis: Hintergrund-Wiedergabe erlaubt YouTube nicht.'],
   [2,'Phase 2','car','Sperrbildschirm & CarPlay','Media Session wie in G04TV: Cover, Titel, Weiter/Zurück im Auto und Kontrollzentrum.'],
   [2,'Phase 2','lyrics','Liedtexte zu deinen Songs','Eigene Texte als .lrc ablegen, zeilenweise mitlaufend auf der Bühne.'],
   [2,'Phase 2','moon','Einschlaf-Timer & Crossfade','Übernommen aus G04TV, dazu weiche Übergänge zwischen Songs.'],
   [3,'Später','cloud','Song-Seite für Fans','Jeder Song bekommt einen teilbaren Link mit Cover, Player und Link zum YouTube-Video.'],
   [3,'Später','clock','Statistik','Meistgehörte Songs und Sender, Hörzeit pro Woche – nur auf dem Gerät.']];
  var PR={1:'Muss',2:'Soll',3:'Kann'};
  return '<section class="panel glass"><div class="sec-h" style="margin-bottom:12px"><h3>Akzentfarbe – live ausprobieren</h3><span>Aufbau, Glas und Raster bleiben wie G04TV</span></div><div class="swatches">'+
    ACC.map(function(c,i){return '<button class="swatch'+(st.acc===i?' is-active':'')+'" data-acc="'+i+'"><i style="background:linear-gradient(140deg,'+c.a+','+c.b+');box-shadow:0 0 16px '+c.a+'55"></i><div><b>'+c.n+'</b><span>'+c.d+'</span></div></button>'}).join('')+'</div></section>'+
   '<div class="sec-h"><h3>Funktionen</h3><span>Muss · Soll · Kann</span></div><section class="cards">'+F.map(function(f){return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="card__ic'+(f[0]>1?' card__ic--v':'')+'">'+ic(f[2],20)+'</span><span class="prio prio--'+f[0]+'">'+PR[f[0]]+'</span></div><b>'+f[3]+'</b><p>'+f[4]+'</p><div class="meta"><span class="phase">'+f[1]+'</span></div></div>'}).join('')+'</section>'+
   '<section class="panel glass"><div class="sec-h" style="margin-bottom:8px"><h3>Technik wie bei G04TV</h3></div><div class="set">'+
   [['Vanilla JS, HTML, CSS','Kein Framework, kein Backend – gleiche Ordner: css/, js/, icons/'],['PWA mit Service Worker','Installierbar auf iPhone, Android, Desktop; offline lauffähig'],['IndexedDB + localStorage','Songs und Sender bleiben auf dem Gerät'],['GitHub Pages','paulfv.github.io/G04Musik, später TWA für den Play Store']].map(function(x){return '<div class="set__row"><div><b>'+x[0]+'</b><span>'+x[1]+'</span></div></div>'}).join('')+'</div></section>';
}
var VIEWS={start:startView,mine:mineView,radio:radioView,yt:ytView,sources:sourcesView,settings:settingsView,ideas:ideasView};
function render(){$('#viewHost').innerHTML='<div class="view">'+VIEWS[st.view]()+'</div>';chrome();sizeViz()}

/* ---------- Wiedergabe (simuliert) ---------- */
function listOf(x){return x.k==='song'?SONGS:x.k==='radio'?RADIO:YT}
function nextOf(x,dir){var l=listOf(x),i=l.indexOf(x);if(st.shuffle&&dir!==-1){var j;do{j=Math.floor(Math.random()*l.length)}while(l.length>1&&j===i);return l[j]}return l[(i+(dir||1)+l.length)%l.length]}
function play(id){var x=ALL[id];if(!x)return;
  if(st.cur&&st.cur.id===id){st.playing=!st.playing}else{st.cur=x;st.pos=0;st.playing=true;st.hist=[id].concat(st.hist.filter(function(h){return h!==id})).slice(0,12);ls.set('hist',st.hist)}
  render()}
function chrome(){
  var c=st.cur,lc=$('#liveChip');
  lc.className='live-chip'+(c&&st.playing?(c.k==='radio'?' is-on is-radio':' is-on'):'');
  lc.querySelector('span').textContent=c?c.t:'Nichts läuft';
  $('#sideNow').className='now-chip'+(c&&st.playing?' is-live':'');
  $('#sideNow').innerHTML='<span class="now-chip__ic">'+ic(c?(c.k==='radio'?'radio':c.k==='yt'?'yt':'music'):'music',17)+'</span><span class="now-chip__meta"><b>'+(c?esc(c.t):'Nichts läuft')+'</b><span>'+(c?(st.playing?'spielt':'pausiert')+' · '+esc(c.k==='song'?c.a:c.s):'bereit')+'</span></span>';
  var d=$('#pdock'),show=c&&['start','mine','radio','yt'].indexOf(st.view)<0;
  d.hidden=!show;
  if(show)d.innerHTML='<div class="cover" style="'+art(c.h)+'">'+ini(c.t)+'</div><div class="pdock__meta"><b>'+esc(c.t)+'</b><span>'+esc(c.s)+'</span></div><button class="play-btn" data-act="toggle" aria-label="Abspielen/Pause">'+ic(st.playing?'pause':'play',18)+'</button><button class="icon-btn" data-go="start" aria-label="Zur Bühne">'+ic('chev',16)+'</button>';
}
setInterval(function(){
  if(!st.cur||!st.playing||st.cur.k==='radio')return;
  st.pos+=1;
  if(st.pos>=st.cur.d){if(st.repeat){st.pos=0}else{st.cur=nextOf(st.cur);st.pos=0;render();return}}
  var p=$('#pPos'),b=$('#pBar i');if(p)p.textContent=fmt(st.pos);if(b)b.style.width=(st.pos/st.cur.d*100)+'%';
},1000);

/* ---------- Visualizer ---------- */
var cv,cx,bars=new Array(48).fill(0),t0=0;
function sizeViz(){cv=$('#viz');if(!cv)return;cx=cv.getContext('2d');var r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);cv.width=r.width*dpr;cv.height=r.height*dpr}
function frame(t){
  requestAnimationFrame(frame);
  if(!cv||!cv.isConnected||!cx)return;
  var w=cv.width,h=cv.height,acc=getComputedStyle(document.documentElement).getPropertyValue('--acc-rgb').trim();
  cx.clearRect(0,0,w,h);
  var n=bars.length,bw=w/n,on=st.cur&&st.playing;
  for(var i=0;i<n;i++){
    var target=on?(0.18+0.55*Math.abs(Math.sin(t/430+i*.55)*Math.cos(t/910+i*.23))+0.25*Math.random()*(i<n*.35?1:.5))*(1-i/n*.45):0.03+0.02*Math.sin(t/900+i);
    bars[i]+= (target-bars[i])*0.18;
    var bh=bars[i]*h*.62, x=i*bw+bw*.18;
    var g=cx.createLinearGradient(0,h,0,h-bh);g.addColorStop(0,'rgba('+acc+',.05)');g.addColorStop(1,'rgba('+acc+','+(on?.75:.25)+')');
    cx.fillStyle=g;cx.fillRect(x,h-bh,bw*.64,bh);
  }
}
requestAnimationFrame(frame);
window.addEventListener('resize',sizeViz);

/* ---------- Ereignisse ---------- */
function toast(m){var t=document.createElement('div');t.className='toast glass';t.textContent=m;$('#toasts').appendChild(t);setTimeout(function(){t.remove()},2600)}
function toggleFav(id){var i=st.fav.indexOf(id);if(i>=0)st.fav.splice(i,1);else st.fav.unshift(id);ls.set('fav',st.fav);toast(i>=0?'Aus Favoriten entfernt':'Zu Favoriten hinzugefügt');render()}
document.addEventListener('click',function(e){
  if(lp==='done'){lp=null;return}
  var el=e.target.closest('[data-go],[data-play],[data-tab],[data-act],[data-genre],[data-acc],[data-sw],[data-toast]');if(!el)return;
  var d=el.dataset;
  if(d.go)go(d.go);
  else if(d.play)play(d.play);
  else if(d.tab){st.tab=d.tab;ls.set('tab',d.tab);render()}
  else if(d.genre){st.genre=d.genre;render()}
  else if(d.acc){applyAcc(+d.acc);render();toast('Akzentfarbe: '+ACC[+d.acc].n)}
  else if(d.sw){el.setAttribute('aria-checked',el.getAttribute('aria-checked')==='true'?'false':'true')}
  else if(d.toast)toast(d.toast);
  else if(d.act){var c=st.cur;
    if(d.act==='toggle'&&c){st.playing=!st.playing;render()}
    if(d.act==='next'&&c){st.cur=nextOf(c);st.pos=0;st.playing=true;render()}
    if(d.act==='prev'&&c){if(st.pos>3&&c.k!=='radio'){st.pos=0}else{st.cur=nextOf(c,-1);st.pos=0}st.playing=true;render()}
    if(d.act==='shuffle'){st.shuffle=!st.shuffle;render()}
    if(d.act==='repeat'){st.repeat=!st.repeat;render()}
    if(d.act==='fav'&&c)toggleFav(c.id);
    if(d.act==='lyrics')toast('Liedtext: geplant für Phase 2 (.lrc-Dateien).');
    if(d.act==='sleep'){st.sleep=st.sleep>=90?0:st.sleep+15;render();toast(st.sleep?'Einschlaf-Timer: '+st.sleep+' Minuten':'Einschlaf-Timer aus')}
  }
});
document.addEventListener('contextmenu',function(e){var el=e.target.closest('[data-play]');if(el){e.preventDefault();toggleFav(el.dataset.play)}});
var lp;document.addEventListener('pointerdown',function(e){var el=e.target.closest('[data-play]');if(!el)return;lp=setTimeout(function(){lp='done';toggleFav(el.dataset.play)},600)});
document.addEventListener('pointerup',function(e){if(lp!=="done")clearTimeout(lp)});
$('#liveChip').addEventListener('click',function(){go('start')});
$('#accBtn').addEventListener('click',function(){applyAcc((st.acc+1)%ACC.length);render();toast('Akzentfarbe: '+ACC[st.acc].n)});

applyAcc(st.acc);
st.cur=SONGS[0];st.pos=62;st.playing=false;
go('start');
})();
</script>

</html>
