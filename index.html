      <!-- ============ DIE BÜHNE ============
           Bleibt immer im Dokument (damit ein YouTube-Video beim Blättern
           nicht neu startet) und wird nur ein- und ausgeblendet. -->
      <section class="hero glass" id="hero">
        <div class="stage" id="stage">
          <div class="stage__bg" id="stageBg"></div>
          <canvas class="stage__viz" id="viz"></canvas>
          <!-- Eigene Dateien (Musik und Musikvideos) laufen über dieses eine Element -->
          <video class="stage__video" id="media" playsinline webkit-playsinline x-webkit-airplay="allow" preload="metadata" hidden></video>
          <div class="stage__yt" id="ytHost"></div>

          <div class="stage__tools" id="stageTools">
            <button class="icon-btn" id="stagePip" type="button" title="Bild-in-Bild" aria-label="Bild-in-Bild" hidden>
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"/></svg>
            </button>
            <button class="icon-btn" id="stageFull" type="button" title="Vollbild" aria-label="Vollbild">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            </button>
          </div>

          <div class="stage__badges" id="stageBadges"></div>

          <div class="stage__cover" id="stageCover" hidden>
            <div class="cover" id="stageArt"></div>
            <div class="stage__meta">
              <small id="stageKind"></small>
              <h2 id="stageTitle"></h2>
              <p id="stageSub"></p>
            </div>
          </div>

          <div class="stage__idle" id="stageIdle">
            <span class="stage__mark"><svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor" aria-hidden="true"><path d="M8 5.5l11 6.5-11 6.5v-13z"/></svg></span>
            <b>Nichts läuft</b>
            <p>Wähle einen Song, einen Sender oder ein Video.</p>
          </div>

          <div class="stage__busy" id="stageBusy" hidden><div class="stage__ring"></div></div>

          <div class="stage__err" id="stageErr" hidden>
            <b>Das ließ sich nicht abspielen</b>
            <p id="stageErrText"></p>
            <div class="btn-row"><button class="btn btn--sm" id="stageRetry" type="button">Noch einmal</button></div>
          </div>
        </div>

        <div class="np" id="np"></div>
      </section>

      <div class="view-host" id="viewHost"></div>
